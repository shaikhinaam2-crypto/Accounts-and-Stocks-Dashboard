app = "sf-personal-dashboard-app"
primary_region = "sin" # Singapore region (closest low-latency region to Pakistan)

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "sf_db_data"
  destination = "/var/data"